name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # Skip release commits to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Determine next version
        id: version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./web/package.json').version")
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # Get commits since last tag (or all commits if no tags)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --format="%s")
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --format="%s")
          fi

          # Check if there are releasable commits
          if ! echo "$COMMITS" | grep -qE "^(feat|fix|perf)(\(.*\))?!?:"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No releasable commits found, skipping release."
            exit 0
          fi

          # Determine bump type from conventional commits
          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^(feat|fix|refactor|perf)(\(.*\))?!:|BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.*\))?:"; then
            BUMP="minor"
          fi

          # Calculate next version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          case $BUMP in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Bumping $BUMP: $CURRENT_VERSION → $NEXT_VERSION"

      - name: Bump version in package.json
        if: steps.version.outputs.skip != 'true'
        run: |
          cd web
          npm version ${{ steps.version.outputs.next }} --no-git-tag-version

      - name: Bump version in pyproject.toml
        if: steps.version.outputs.skip != 'true'
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.next }}"/' api/pyproject.toml

      - name: Bump version in FastAPI app
        if: steps.version.outputs.skip != 'true'
        run: |
          sed -i 's/version="[^"]*"/version="${{ steps.version.outputs.next }}"/' api/src/main.py

      - name: Generate changelog
        if: steps.version.outputs.skip != 'true'
        run: |
          git-cliff --tag "v${{ steps.version.outputs.next }}" -o CHANGELOG.md

      - name: Commit and tag release
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/package.json api/pyproject.toml api/src/main.py CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.next }}"
          git tag "v${{ steps.version.outputs.next }}"
          git push origin main --follow-tags

      - name: Generate release notes
        if: steps.version.outputs.skip != 'true'
        id: release_notes
        run: |
          # Extract just this version's notes from the changelog
          NOTES=$(git-cliff --tag "v${{ steps.version.outputs.next }}" --unreleased --strip header)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.next }}"
          name: "v${{ steps.version.outputs.next }}"
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: false
